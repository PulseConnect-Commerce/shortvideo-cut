<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>REWE × Lieferando – Skizzen</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      Transparente Skizzen-Overlays für das REWE-Video (faber-cut, src/projekte/rewe). Die Zeiten sind die Sekunden im
      geschnittenen Video (cut.json), damit jede Zeichnung auf ihrem Wort erscheint:
        Onlineshop 1.55 / Supermarkt 2.80 · Hamburg 7.34 / fünf 8.88 · 45 11.78 · 5.000 15.05 / 9.000 15.83 ·
        REWE-Mitarbeiter 17.73 / Lieferando 20.04 / Zustellung 22.29
      Zeichenfläche: die Brust, x 110-970, y 1010-1380 (über den Untertiteln, unter dem Gesicht).
    -->
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Anton", sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .card {
        position: absolute;
        left: 110px;
        top: 1010px;
        width: 860px;
        height: 370px;
      }
      .panel {
        position: absolute;
        inset: 0;
        border-radius: 40px;
        background: rgba(11, 12, 14, 0.68);
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .art {
        position: absolute;
        inset: 0;
        width: 860px;
        height: 370px;
        overflow: visible;
      }
      .s {
        fill: none;
        stroke: #ffffff;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .g {
        stroke: #00f090;
      }
      .thin {
        stroke-width: 5;
      }
      .lbl {
        position: absolute;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        line-height: 1.05;
        white-space: nowrap;
      }
      .center {
        text-align: center;
      }
      .green {
        color: #00f090;
      }
      .grey {
        color: #c9ced4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="rewe-skizzen" data-start="0" data-duration="23" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" />
            <feDisplacementMap in="SourceGraphic" scale="4" />
          </filter>
        </defs>
      </svg>

      <!-- 0: Onlineshop gegen Supermarkt um die Ecke -->
      <section id="sz0" class="scene clip" data-start="1.45" data-duration="2.5" data-track-index="0">
        <div id="sz0-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <path class="s d0a" pathLength="1" d="M110 70 H290 Q300 70 300 80 V200 H100 V80 Q100 70 110 70 Z" />
              <path class="s d0a" pathLength="1" d="M70 200 H330 L312 228 H88 Z" />
              <path class="s g thin d0a" pathLength="1" d="M150 110 H170 L185 160 H245 L258 125 H178" />
              <circle class="s g thin d0a" pathLength="1" cx="192" cy="178" r="8" />
              <circle class="s g thin d0a" pathLength="1" cx="236" cy="178" r="8" />
              <path class="s d0b" pathLength="1" d="M560 120 H780 V230 H560 Z" />
              <path class="s g d0b" pathLength="1" d="M545 120 L565 75 H775 L795 120 Q778 140 761 120 Q744 140 727 120 Q710 140 693 120 Q676 140 659 120 Q642 140 625 120 Q608 140 591 120 Q574 140 545 120" />
              <path class="s thin d0b" pathLength="1" d="M600 230 V165 H650 V230" />
              <path class="s thin d0b" pathLength="1" d="M690 160 H750 V200 H690 Z" />
            </g>
          </svg>
          <div id="sz0-l1" class="lbl center" style="left: 50px; top: 268px; width: 300px; font-size: 54px">Onlineshop</div>
          <div id="sz0-vs" class="lbl center green" style="left: 380px; top: 110px; width: 100px; font-size: 96px">vs</div>
          <div id="sz0-l2" class="lbl center" style="left: 520px; top: 268px; width: 300px; font-size: 54px">Supermarkt</div>
        </div>
      </section>

      <!-- 1: Hamburg, 5 Märkte -->
      <section id="sz1" class="scene clip" data-start="7.25" data-duration="3.25" data-track-index="0">
        <div id="sz1-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <path class="s g d1a" pathLength="1" d="M170 50 C118 50 92 92 92 128 C92 186 170 262 170 262 C170 262 248 186 248 128 C248 92 222 50 170 50 Z" />
              <circle class="s d1a" pathLength="1" cx="170" cy="128" r="30" />
              <path class="s thin d1a" pathLength="1" d="M110 300 Q170 285 230 300" />
            </g>
            <g id="sz1-maerkte" filter="url(#rough)">
              <g class="m1"><path class="s thin" d="M318 205 H382 V255 H318 Z M312 205 L322 182 H378 L388 205 M340 255 V230 H360 V255" /></g>
              <g class="m1"><path class="s thin" d="M418 205 H482 V255 H418 Z M412 205 L422 182 H478 L488 205 M440 255 V230 H460 V255" /></g>
              <g class="m1"><path class="s thin" d="M518 205 H582 V255 H518 Z M512 205 L522 182 H578 L588 205 M540 255 V230 H560 V255" /></g>
              <g class="m1"><path class="s thin" d="M618 205 H682 V255 H618 Z M612 205 L622 182 H678 L688 205 M640 255 V230 H660 V255" /></g>
              <g class="m1"><path class="s thin" d="M718 205 H782 V255 H718 Z M712 205 L722 182 H778 L788 205 M740 255 V230 H760 V255" /></g>
            </g>
          </svg>
          <div id="sz1-l1" class="lbl" style="left: 300px; top: 52px; font-size: 104px">Hamburg</div>
          <div id="sz1-l2" class="lbl green" style="left: 305px; top: 280px; font-size: 56px">5 REWE-Märkte</div>
        </div>
      </section>

      <!-- 2: Uhr, rund 45 Minuten (angekündigt) -->
      <section id="sz2" class="scene clip" data-start="10.45" data-duration="3.1" data-track-index="0">
        <div id="sz2-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <circle class="s d2a" pathLength="1" cx="190" cy="185" r="130" />
              <path class="s g d2b" pathLength="1" style="stroke-width: 16; opacity: 0.9" d="M190 80 A105 105 0 1 1 85 185" />
              <path class="s thin d2t" d="M190 62 V78 M313 185 H297 M190 308 V292 M67 185 H83" />
              <line id="sz2-zeiger" class="s" x1="190" y1="185" x2="190" y2="96" />
              <circle class="s" cx="190" cy="185" r="6" style="fill: #ffffff" />
            </g>
          </svg>
          <div id="sz2-l1" class="lbl" style="left: 370px; top: 70px; font-size: 118px"><span>≈ </span><span id="sz2-zahl" class="green">0</span><span> Min</span></div>
          <div id="sz2-l2" class="lbl grey" style="left: 374px; top: 240px; font-size: 46px">laut Ankündigung</div>
        </div>
      </section>

      <!-- 3: Korb, 5.000 bis 9.000 Artikel -->
      <section id="sz3" class="scene clip" data-start="13.55" data-duration="3.9" data-track-index="0">
        <div id="sz3-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g id="sz3-waren" filter="url(#rough)">
              <g class="w"><circle class="s thin g" cx="138" cy="150" r="24" /><path class="s thin" d="M138 126 Q146 110 158 108" /></g>
              <g class="w"><path class="s thin" d="M178 172 V112 L186 100 V86 H198 V100 L206 112 V172 Z" /></g>
              <g class="w"><path class="s thin g" d="M212 160 Q212 128 240 128 Q268 128 268 160 Z" /></g>
              <g class="w"><path class="s thin" d="M232 172 V122 L246 104 L260 122 V172 Z" /></g>
            </g>
            <g filter="url(#rough)">
              <path class="s d3a" pathLength="1" d="M80 175 H290 L262 305 H108 Z" />
              <path class="s d3a" pathLength="1" d="M125 175 C125 95 245 95 245 175" />
              <path class="s thin d3a" pathLength="1" d="M95 220 H277 M102 262 H270" />
            </g>
          </svg>
          <div id="sz3-l1" class="lbl" style="left: 330px; top: 70px; font-size: 92px"><span id="sz3-a">5.000</span><span id="sz3-b" class="green"></span></div>
          <div id="sz3-l2" class="lbl" style="left: 334px; top: 230px; font-size: 54px">Artikel je Markt</div>
        </div>
      </section>

      <!-- 4: bestellt -> REWE packt -> Lieferando bringt -->
      <section id="sz4" class="scene clip" data-start="17.45" data-duration="5.4" data-track-index="0">
        <div id="sz4-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <path class="s d4a" pathLength="1" d="M118 50 H182 Q192 50 192 60 V210 Q192 220 182 220 H118 Q108 220 108 210 V60 Q108 50 118 50 Z" />
              <path class="s g thin d4a" pathLength="1" d="M124 108 H136 L146 150 H176 L184 124 H140" />
              <circle class="s g thin d4a" pathLength="1" cx="152" cy="166" r="6" />
              <circle class="s g thin d4a" pathLength="1" cx="172" cy="166" r="6" />
              <path class="s d4b" pathLength="1" d="M370 110 L430 80 L490 110 V190 L430 220 L370 190 Z M370 110 L430 140 L490 110 M430 140 V220" />
              <path class="s g thin d4b" pathLength="1" d="M400 95 L460 125 V150" />
              <path class="s thin d4p1" pathLength="1" d="M215 135 H340" />
              <path class="s thin d4p1h" pathLength="1" d="M325 120 L345 135 L325 150" />
              <path class="s thin d4p2" pathLength="1" d="M515 135 H630" />
              <path class="s thin d4p2h" pathLength="1" d="M615 120 L635 135 L615 150" />
              <circle class="s d4c" pathLength="1" cx="680" cy="200" r="22" />
              <circle class="s d4c" pathLength="1" cx="790" cy="200" r="22" />
              <path class="s d4c" pathLength="1" d="M702 200 H768 L752 150 H712 L700 120 H682" />
              <path class="s g d4c" pathLength="1" d="M735 70 H800 V130 H735 Z" />
            </g>
            <path id="sz4-haken" class="s g" pathLength="1" style="stroke-width: 12" d="M760 40 L782 62 L825 18" />
          </svg>
          <div id="sz4-l1" class="lbl center" style="left: 40px; top: 250px; width: 220px; font-size: 42px">Bestellung</div>
          <div id="sz4-l2" class="lbl center" style="left: 320px; top: 250px; width: 220px; font-size: 42px">REWE packt</div>
          <div id="sz4-l3" class="lbl center" style="left: 600px; top: 250px; width: 260px; font-size: 42px">Lieferando bringt</div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const draw = (sel, at, dur = 0.5) =>
        tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", stagger: 0.06 }, at);
      const card = (id, start, end) => {
        tl.fromTo(`#${id}-card`, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.6)" }, start);
        tl.to(`#${id}-card`, { opacity: 0, y: 12, duration: 0.25, ease: "power2.in" }, end - 0.25);
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, at);
      const zahlDe = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      // 0: Onlineshop (1.55) gegen Supermarkt (2.80)
      card("sz0", 1.45, 3.95);
      draw(".d0a", 1.5, 0.5);
      pop("#sz0-l1", 1.7);
      tl.fromTo("#sz0-vs", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.35);
      draw(".d0b", 2.72, 0.5);
      pop("#sz0-l2", 2.85);

      // 1: Hamburg (7.34), fünf Märkte (8.88)
      card("sz1", 7.25, 10.5);
      draw(".d1a", 7.3, 0.55);
      pop("#sz1-l1", 7.36);
      tl.fromTo("#sz1-maerkte .m1", { opacity: 0, scale: 0.3, transformOrigin: "50% 100%" }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", stagger: 0.12 }, 8.84);
      pop("#sz1-l2", 9.3);

      // 2: Uhr, 45 (11.78) Minuten
      card("sz2", 10.45, 13.55);
      draw(".d2a", 10.5, 0.5);
      tl.fromTo(".d2t", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 10.8);
      tl.fromTo("#sz2-zeiger", { rotation: 0, svgOrigin: "190 185" }, { rotation: 270, svgOrigin: "190 185", duration: 0.9, ease: "power2.inOut" }, 11.72);
      draw(".d2b", 11.72, 0.9);
      pop("#sz2-l1", 10.6);
      const uhr = { n: 0 };
      tl.fromTo(uhr, { n: 0 }, { n: 45, duration: 0.9, ease: "power2.inOut", onUpdate: () => { document.getElementById("sz2-zahl").textContent = Math.round(uhr.n); } }, 11.72);
      pop("#sz2-l2", 12.1);

      // 3: Korb, Waren, 5.000 (15.05) bis 9.000 (15.83)
      card("sz3", 13.55, 17.45);
      draw(".d3a", 13.6, 0.55);
      tl.fromTo("#sz3-waren .w", { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.35, ease: "bounce.out", stagger: 0.18 }, 14.1);
      pop("#sz3-l1", 15.0);
      const zahl = { n: 5000 };
      tl.fromTo(zahl, { n: 5000 }, { n: 9000, duration: 0.55, ease: "power2.out", onUpdate: () => { document.getElementById("sz3-b").textContent = " – " + zahlDe(Math.round(zahl.n / 100) * 100); } }, 15.8);
      pop("#sz3-l2", 16.35);

      // 4: Bestellung (17.5), REWE packt (REWE-Mitarbeiter 17.73), Lieferando (20.04), Zustellung (22.29)
      card("sz4", 17.45, 22.85);
      draw(".d4a", 17.5, 0.45);
      pop("#sz4-l1", 17.6);
      draw(".d4p1", 17.8, 0.35);
      draw(".d4p1h", 18.1, 0.15);
      draw(".d4b", 18.1, 0.5);
      pop("#sz4-l2", 18.3);
      draw(".d4p2", 19.55, 0.4);
      draw(".d4p2h", 19.9, 0.15);
      draw(".d4c", 20.0, 0.55);
      pop("#sz4-l3", 20.15);
      tl.fromTo("#sz4-haken", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 22.28);

      tl.seek(0);
      window.__timelines["rewe-skizzen"] = tl;
    </script>
  </body>
</html>
