      ein("#k4-p1", 20.39); ein("#k4-p2", 21.84);
      zeichne("#k4-pfeil", 22.84, 0.3);

      ein("#k7-q", 37.6, 0.35);
      [["#k7-r1", 39.63], ["#k7-r2", 39.71], ["#k7-r3", 39.79]].forEach(([s, t]) => tl.fromTo(s, { opacity: 0, x: 14 }, { opacity: 0.45, x: 0, duration: 0.3, ease: "power2.out" }, t));

      tl.to("#k7-r3", { opacity: 1, duration: 0.2 }, 42.59);

      // K8 Theme dupliziert sich, die KI-Anpassung landet auf der Kopie, die Kopie geht aufs Smartphone
      karte("#k8", 43.93, 51.0);
      tl.fromTo("#k8-schwebe", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 45.01);
      tl.set("#k8-kopie", { opacity: 1 }, 46.89);
      tl.fromTo("#k8-kopie", { x: 0, y: 0 }, { x: 270, y: 0, duration: 0.5, ease: "power2.inOut" }, 46.89);
      ein("#k8-kt", 47.2);
      badge("#k8-schloss", 47.25);
      tl.to("#k8-schwebe", { x: 30, y: 112, opacity: 0, duration: 0.45, ease: "power2.in" }, 47.31);
      tl.to("#k8-ki", { opacity: 1, duration: 0.2 }, 47.66);
      // Smartphone
      tl.to("#k8-kopie", { x: 539, y: 26, scale: 0.92, svgOrigin: "60 34", duration: 0.5, ease: "power2.inOut" }, 49.53);

      // K9 Regler: Knopf gleitet auf "komplexere" nach rechts, Landingpage, "Page Builder", ✓ auf "sinnvoll"

      pop("#k9-lp", 52.21);
      ein("#k9-pb", 53.91);
      badge("#k9-ok", 54.43);

      // K10 neue Seite, das Abo hängt sich an und wird auf "zusätzlich" gestrichen

      pop("#k10-neu", 56.34);
      tl.fromTo("#k10-abo", { opacity: 0, x: 40, rotation: 6, svgOrigin: "560 140" }, { opacity: 1, x: 0, rotation: 0, duration: 0.4, ease: "power2.out" }, 58.03);
      tl.to("#k10-faden", { opacity: 1, duration: 0.25 }, 58.15);
      zeichne("#k10-strich", 58.85, 0.3);
      tl.to("#k10-abo, #k10-faden", { opacity: 0.35, duration: 0.3 }, 59.0);

      // K11 Folgen: Karte auf "Tipps", Ring auf "folgt", Zeiger tippt auf "Plus" das Plus an, es wird zum Haken
      tl.fromTo("#k11", { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 60.47);
      tl.fromTo("#fring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.7, ease: "power2.out" }, 62.29);
      tl.fromTo("#fzeiger", { opacity: 0, x: 330, y: 150 }, { opacity: 1, x: 310, y: 140, duration: 0.15, ease: "power2.out" }, 63.5);
      tl.to("#fzeiger", { x: 94, y: 92, duration: 0.55, ease: "power2.inOut" }, 63.6);
      tl.to("#fzeiger", { scale: 0.85, duration: 0.08, ease: "power2.in" }, 64.12);
      tl.to("#fzeiger", { scale: 1, duration: 0.15, ease: "power2.out" }, 64.2);
      tl.to("#fplus", { backgroundColor: "#00d088", duration: 0.15 }, 64.17);
      tl.to("#fplus .kreuz", { opacity: 0, duration: 0.12 }, 64.17);
      tl.to("#fplus .haken", { opacity: 1, duration: 0.15 }, 64.2);
      tl.to("#ft2", { opacity: 1, duration: 0.2 }, 64.2);
      tl.to("#ft1", { opacity: 0, duration: 0.2 }, 64.2);
      tl.to("#fzeiger", { x: 132, y: 128, duration: 0.25, ease: "power2.out" }, 64.38);

      tl.seek(0);
      window.__timelines["pagebuilder-skizzen"] = tl;
    </script>
