<!doctype html>
<html lang="de">
  <head>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--
      Transparente Skizzen-Overlays fuer "Shopify Sidekick + Drittanbieter-Apps" (faber-cut, src/projekte/sidekick).
      Vorlage: hyperframes/googleads-skizzen. Zeiten = Sekunden im geschnittenen Video (cut.json).
      Karte ueber dem Kopf (860x370 auf 90 %), Hook (bis ~3,0 s) gehoert dem Hook-Titel. Nur Text und schlichte Icons, keine Logos.
    -->
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Anton", sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .card {
        position: absolute;
        left: 110px;
        top: 290px;
        width: 860px;
        height: 370px;
        opacity: 0;
      }
      .panel {
        position: absolute;
        inset: 0;
        border-radius: 40px;
        background: rgba(11, 12, 14, 0.86);
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .art {
        position: absolute;
        inset: 0;
        width: 860px;
        height: 370px;
        overflow: visible;
      }
      .s {
        fill: none;
        stroke: #ffffff;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .g {
        stroke: #00f090;
      }
      .r {
        stroke: #ff5a5f;
      }
      .thin {
        stroke-width: 5;
      }
      .lbl {
        position: absolute;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        line-height: 1.05;
        white-space: nowrap;
      }
      .center {
        text-align: center;
      }
      .green {
        color: #00f090;
      }
      .red {
        color: #ff5a5f;
      }
      .grey {
        color: #c9ced4;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="sidekick-skizzen" data-start="0" data-duration="38.22" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">

          </filter>
        </defs>
      </svg>

      <!-- 1: Sidekick arbeitet mit Apps / Sidekick App Extensions (3.3-13.75) -->

      </section>

      <!-- 3: Beispiel Matrixify (18.3-22.25) -->
      <section id="sz3" class="scene clip" data-start="18.3" data-duration="3.95" data-track-index="0">
        <div id="sz3-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <path class="s d3a" pathLength="1" d="M50 60 H240 V200 H50 Z" />
              <path class="s thin d3a" pathLength="1" d="M50 107 H240 M50 154 H240 M113 60 V200 M177 60 V200" />
              <path class="s g d3b" pathLength="1" d="M95 285 A38 38 0 1 1 135 322 M135 322 L112 322 M135 322 L135 345" style="stroke-width: 8" />
              <path class="s g thin d3b" pathLength="1" d="M200 330 A38 38 0 1 1 160 293 M160 293 L183 293 M160 293 L160 270" style="stroke-width: 8" />

          <div id="sz3-l0" class="lbl grey" style="left: 290px; top: 28px; font-size: 56px; opacity: 0">Beispiel:</div>

      <!-- 4: führt direkt in die App (22.3-26.55) -->
      <section id="sz4" class="scene clip" data-start="22.3" data-duration="4.25" data-track-index="0">

              <path class="s thin d4c" pathLength="1" d="M395 51 H405 M425 51 H435" />

          <div id="sz4-l1" class="lbl grey center" style="left: 0; width: 860px; top: 238px; font-size: 46px; opacity: 0">Sidekick führt dich</div>
          <div id="sz4-l2" class="lbl green center" style="left: 0; width: 860px; top: 292px; font-size: 66px; opacity: 0">direkt in die App</div>
        </div>
      </section>

      <!-- 5: nicht jede App / nicht vollautomatisch (26.65-33.3) -->
      <section id="sz5" class="scene clip" data-start="26.65" data-duration="6.65" data-track-index="0">
        <div id="sz5-card" class="card">
          <div class="panel"></div>
          <svg class="art" viewBox="0 0 860 370">
            <g filter="url(#rough)">
              <g class="a5">
                <rect class="s d5a" pathLength="1" x="130" y="40" width="110" height="110" rx="24" />
                <rect class="s d5a" pathLength="1" x="375" y="40" width="110" height="110" rx="24" />
                <rect class="s d5a" pathLength="1" x="620" y="40" width="110" height="110" rx="24" />
                <path class="s g d5b" pathLength="1" style="stroke-width: 12" d="M160 95 L184 120 L216 70" />

                <rect class="s thin d5e" pathLength="1" x="580" y="125" width="44" height="44" rx="10" />

          <div id="sz5-l2" class="lbl center" style="left: 0; width: 860px; top: 278px; font-size: 80px; opacity: 0">jede App</div>
          <div id="sz5-m1" class="lbl red" style="left: 40px; top: 220px; font-size: 96px; opacity: 0">Nicht</div>
          <div id="sz5-m2" class="lbl" style="left: 40px; top: 300px; font-size: 62px; opacity: 0">vollautomatisch</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const draw = (sel, at, dur = 0.5) =>
        tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", stagger: 0.06 }, at);
      const card = (id, start, end) => {
        tl.fromTo(`#${id}-card`, { opacity: 0, scale: 0.83, transformOrigin: "50% 0%" }, { opacity: 1, scale: 0.9, duration: 0.28, ease: "back.out(1.6)" }, start);
        tl.to(`#${id}-card`, { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, end - 0.25);
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, at);
      const show = (sel, at, dur = 0.25) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: dur }, at);

      // 1: Und das ist (3.08) ... Shopbetreiber (4.38) | sogenannten (6.39) Sidekick (6.95) App (7.79) Extensions (8.00) |
      //    Informationen (9.84) Drittanbieter-Apps (10.98 / 11.66) seine Antwort (12.21 / 12.57)
      card("sz1", 3.3, 13.75);
      draw(".d1a", 3.35, 0.5);
      pop("#sz1-la", 3.36);
      pop("#sz1-lb", 3.75);
      draw(".d1b", 4.2, 0.4);
      draw(".d1c", 4.38, 0.4);
      draw(".d1d", 4.6, 0.4);
      draw(".d1e", 4.82, 0.4);
      tl.to([".a1", "#sz1-la", "#sz1-lb"], { opacity: 0, duration: 0.15 }, 6.2);
      tl.to(".b1", { opacity: 1, duration: 0.05 }, 6.3);
      draw(".d1f", 6.32, 0.5);
      pop("#sz1-m1", 6.93);
      pop("#sz1-m2", 7.77);
      pop("#sz1-m3", 7.98);
      show("#sz1-q", 8.5, 0.3);
      tl.to("#sz1-m1, #sz1-m2, #sz1-m3", { y: -22, duration: 0.3, ease: "power2.inOut" }, 9.8);
      tl.to("#sz1-tiles", { opacity: 1, duration: 0.05 }, 9.8);
      tl.fromTo("#sz1-t1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 10.96);
      tl.fromTo("#sz1-t2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 11.2);
      tl.fromTo("#sz1-t3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 11.44);
      show("#sz1-app", 11.64, 0.25);
      draw("#sz1-arr", 12.2, 0.45);
      tl.to("#sz1-spark", { fill: "rgba(0,240,144,0.4)", duration: 0.25 }, 12.55);

      // 2: und zum Beispiel (14.05 / 14.18) eben aus Klaviyo (14.91) ... Marketing-Kampagnen (16.50 / 16.84) hast (17.28)
      card("sz2", 13.95, 18.15);
      draw(".d2a", 14.0, 0.5);
      pop("#sz2-l0", 14.16);
      pop("#sz2-l1", 14.89);
      draw(".d2b", 16.4, 0.6);
      pop("#sz2-l2", 16.82);
      pop("#sz2-l3", 17.26);

      // 3: oder eben auch aus (17.93 / 18.39 / 18.57) Matrixify (18.78) ... Daten (20.36) Abläufe (21.07)
      card("sz3", 18.3, 22.25);
      draw(".d3a", 18.35, 0.5);
      pop("#sz3-l0", 18.4);
      pop("#sz3-l1", 18.76);
      pop("#sz3-l2", 20.34);
      pop("#sz3-l3", 21.05);
      draw(".d3b", 21.05, 0.6);

      // 4: Teilweise (22.38) führt (22.80) ... direkt (23.81) ... Stellen (24.70) App (25.96)
      card("sz4", 22.3, 26.55);
      draw(".d4a", 22.35, 0.5);
      pop("#sz4-l1", 22.78);
      draw(".d4b", 23.79, 0.35);
      pop("#sz4-l2", 23.79);
      draw(".d4c", 23.95, 0.6);
      tl.fromTo("#sz4-btn", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 24.7);
      tl.fromTo("#sz4-cur", { opacity: 0, x: 40, y: 30 }, { opacity: 1, x: 0, y: 0, duration: 0.5, ease: "power2.out" }, 25.0);

      // 5: Aber (26.72) wichtig (26.92) das klappt (27.78) nicht (28.34) für jede App (28.62 / 28.92) |
      //    nicht (30.47) dass Sidekick (30.83) plötzlich (31.45) alle Aufgaben (31.91 / 32.09) erledigt (32.97)
      card("sz5", 26.65, 33.3);
      draw(".d5a", 26.7, 0.5);
      draw(".d5b", 27.76, 0.3);
      draw(".d5c", 28.32, 0.3);
      pop("#sz5-l1", 28.32);
      pop("#sz5-l2", 28.6);
      tl.to([".a5", "#sz5-l1", "#sz5-l2"], { opacity: 0, duration: 0.15 }, 29.4);
      tl.to(".b5", { opacity: 1, duration: 0.05 }, 29.5);
      draw(".d5d", 29.52, 0.5);
      pop("#sz5-m1", 30.45);
      pop("#sz5-m2", 31.43);
      draw(".d5e", 29.85, 0.5);
      draw("#sz5-haken", 32.95, 0.25);

      tl.seek(0);
      window.__timelines["sidekick-skizzen"] = tl;
    </script>
