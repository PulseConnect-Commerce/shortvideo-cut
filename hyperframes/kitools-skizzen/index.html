          <rect id="k10-b2" x="200" y="96" width="0" height="34" rx="17" fill="#9aa3af" />
          <rect id="k10-b2v" x="200" y="96" width="500" height="34" rx="17" fill="url(#gvd)" opacity="0" />
          <text x="30" y="198" class="lab" style="font-size:25px">Prozess 3</text>
          <rect x="200" y="172" width="540" height="34" rx="17" class="spur" />
          <rect id="k10-b3" x="200" y="172" width="0" height="34" rx="17" fill="#9aa3af" />
          <g id="k10-uhr" opacity="0"><circle cx="736" cy="113" r="30" fill="#0b0c0e" /><use href="#timer" class="ico weiss" transform="translate(718 93) scale(1.5)" style="stroke-width:2.2" /></g>
          <clipPath id="k10-clip"><rect id="k10-cliprect" x="484" y="214" width="0" height="86" /></clipPath>
          <text x="490" y="280" class="hand" style="font-size:60px" clip-path="url(#k10-clip)" transform="rotate(-3 610 262)">meiste Zeit</text>
        </svg>
      </section>

      <!-- K11 Klarer Ablauf (bleibt bis zum letzten Frame, Loop in den Hook): "und dann natürlich kann ich genau diesen Ablauf verbessern
           und dafür eben eine KI in dem Shop einsetzen." Ablauf 53,57 / verbessern 53,90 / eine 55,37 / KI 55,60 / Shop 56,17 / einsetzen 56,40 -->
      <section id="k11" class="karte clip" data-start="51.600" data-duration="5.500" data-track-index="1">
        <div class="kicker">Genau diesen Ablauf</div>
        <svg class="buehne" viewBox="0 0 820 300">
          <text x="30" y="112" class="lab" style="font-size:28px">Prozess 2</text>
          <rect x="200" y="84" width="540" height="40" rx="20" class="spur" />
          <rect id="k11-platz" x="200" y="84" width="500" height="40" rx="20" class="platz" opacity="0" />
          <rect id="k11-bar" x="200" y="84" width="500" height="40" rx="20" fill="url(#gvd)" />
          <g id="k11-uhr"><circle cx="0" cy="0" r="30" fill="#0b0c0e" /><use href="#timer" class="ico weiss" transform="translate(-18 -20) scale(1.5)" style="stroke-width:2.2" /></g>
          <rect id="k11-ring" x="14" y="66" width="740" height="76" rx="30" fill="none" stroke="#31adec" stroke-width="4" opacity="0" />
          <path id="k11-weg" d="M 400 160 C 400 200, 430 212, 470 212" fill="none" stroke="#9aa3af" stroke-width="4" stroke-linecap="round" stroke-dasharray="1" />
          <g id="k11-ki" opacity="0"><use href="#kichip" x="512" y="212" /></g>
          <g id="k11-ok" opacity="0"><use href="#ok" x="586" y="212" /></g>
          <clipPath id="k11-clip"><rect id="k11-cliprect" x="40" y="186" width="0" height="100" /></clipPath>
          <text x="46" y="262" class="hand" style="font-size:66px" clip-path="url(#k11-clip)" transform="rotate(-3 150 244)">eine KI</text>
        </svg>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Zeiten sind Sekunden im geschnittenen Video, schon genau wie Remotion (Stücke auf ganze Frames gerundet) und als Cues.

      // Karte rein mit Kicker, raus weich mit Blur und Fade (ohne "aus" bleibt sie stehen)
      function karte(id, an, aus) {
        tl.fromTo(id, { opacity: 0, y: 24, scale: 0.98, filter: "blur(0px)" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, an);
        const k = document.querySelector(id + " .kicker");
        if (k) tl.fromTo(k, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, an + 0.04);
        if (aus) tl.to(id, { opacity: 0, filter: "blur(8px)", y: -6, duration: 0.3, ease: "power2.in" }, aus - 0.3);
      }
      const ein = (sel, t, d = 0.3) => tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
      const pop = (sel, t, d = 0.3) => tl.fromTo(sel, { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "power2.out" }, t);
      const badge = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, t);
      const auf = (sel, t, d = 0.15) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "none" }, t);
      function zeichne(sel, t, d = 0.5) {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      }
      function schreibe(sel, breite, t, d = 0.45) {
        tl.fromTo(sel, { attr: { width: 0 } }, { attr: { width: breite }, duration: d, ease: "power1.out" }, t);
      }
      function ring(sel, t) {
        tl.set(sel, { opacity: 0.95, scale: 1, transformOrigin: "50% 50%" }, t);
        tl.to(sel, { opacity: 0, scale: 1.04, duration: 0.8, ease: "power2.out" }, t + 0.02);
      }
      // Waage: der Balken kippt um den Drehpunkt (300, 70), die Schalen bleiben waagrecht und folgen den Balkenenden (Arm 190)
      function kippe(pre, grad, t, d = 0.6) {
        const dy = 190 * Math.sin((grad * Math.PI) / 180);
        tl.to(`#${pre}-balken`, { rotation: grad, svgOrigin: "300 70", duration: d, ease: "power2.inOut" }, t);
        tl.to(`#${pre}-pl`, { y: -dy, duration: d, ease: "power2.inOut" }, t);
        tl.to(`#${pre}-pr`, { y: dy, duration: d, ease: "power2.inOut" }, t);
      }
      function stellWaage(pre, grad) {
        const dy = 190 * Math.sin((grad * Math.PI) / 180);
        gsap.set(`#${pre}-balken`, { rotation: grad, svgOrigin: "300 70" });
        gsap.set(`#${pre}-pl`, { y: -dy });
        gsap.set(`#${pre}-pr`, { y: dy });
      }
      gsap.set("#k5-weg, #k7-weg, #k8-zeig, #k9-strich, #k9-kabel, #k11-weg", { strokeDasharray: 1, strokeDashoffset: 1 });
      gsap.set("#k7-weg, #k8-zeig, #k9-strich, #k9-kabel, #k11-weg", { opacity: 0 });

      // K1 zehn KI-Tools, der Tacho steigt erst ein wenig und fällt auf "Gegenteil" ins Minus
      karte("#k1", 4.20, 6.533);
      tl.fromTo("#k1 .k1-k", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out", stagger: 0.035 }, 4.24);
      tl.fromTo("#k1-nadel", { rotation: 0, svgOrigin: "600 175" }, { rotation: 30, svgOrigin: "600 175", duration: 0.5, ease: "power2.out" }, 4.333);
      tl.to("#k1-nadel", { rotation: -68, svgOrigin: "600 175", duration: 0.55, ease: "power2.inOut" }, 5.333);
      tl.to("#k1-kacheln", { opacity: 0.45, duration: 0.3 }, 5.40);
      schreibe("#k1-cliprect", 270, 5.45, 0.5);

      // K2 ein Shop, immer mehr Apps
      karte("#k2", 6.533, 11.067);
      tl.set("#k2 .k2-a", { opacity: 0 }, 0);
      tl.fromTo("#k2 .k2-a:nth-child(-n+2)", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", stagger: 0.1 }, 6.60);
      tl.fromTo("#k2 .k2-a:nth-child(n+3):nth-child(-n+4)", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", stagger: 0.1 }, 8.60);
      tl.fromTo("#k2 .k2-a:nth-child(n+5)", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out", stagger: 0.06 }, 9.20);
      schreibe("#k2-cliprect", 240, 9.70, 0.45);

      // K3 Browser mit einem Tab je Tool, auf "zu viel" wird die Tab-Leiste voll
      karte("#k3", 11.067, 18.067);
      tl.set("#k3 .k3-tab, #k3 .k3-mehr", { opacity: 0 }, 0);
      tl.set("#k3-b0", { opacity: 0 }, 0);
      pop("#k3-t0", 11.10, 0.3);
      ein("#k3-b0", 11.467, 0.3);
      function tab(i, t) {
        tl.to(`#k3-t${i - 1} .k3-r`, { fill: "#f3f4f6", duration: 0.2 }, t);
        pop(`#k3-t${i}`, t, 0.3);
        tl.to(`#k3-b${i - 1}`, { opacity: 0, duration: 0.15 }, t);
        ein(`#k3-b${i}`, t + 0.05, 0.3);
      }
      tab(1, 12.80);
      tab(2, 13.833);
      tab(3, 15.233);
      // "zu viel": die vier Tabs werden schmal, sechs weitere drängen hinein
      [0, 1, 2, 3].forEach((i) => {
        tl.to(`#k3-t${i}`, { x: 104 + i * 69, duration: 0.45, ease: "power2.inOut" }, 17.60);
        tl.to(`#k3-t${i} .k3-r`, { attr: { width: 64 }, fill: "#f3f4f6", duration: 0.45, ease: "power2.inOut" }, 17.60);
        tl.to(`#k3-t${i} .k3-x`, { opacity: 0, duration: 0.15 }, 17.60);
      });
      tl.fromTo("#k3 .k3-mehr", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", stagger: 0.05 }, 17.70);
      tl.to("#k3-b3", { opacity: 0.35, duration: 0.25 }, 17.70);
      schreibe("#k3-cliprect", 220, 17.77, 0.3);

      // K4 Waage: Zeitersparnis wiegt schwer (das Versprechen)
      karte("#k4", 18.067, 21.867);
      tl.fromTo("#k4-block", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.in" }, 18.50);
      kippe("k4", -8, 18.85, 0.55);
      tl.to("#k4-block", { scale: 1.12, transformOrigin: "50% 100%", duration: 0.4, ease: "power2.out" }, 20.367);
      kippe("k4", -13, 20.40, 0.5);
      schreibe("#k4-cliprect", 330, 21.167, 0.55);

      // K5 drei Tools: der Zeiger springt hin und her, Ergebnisse werden geprüft, Daten wandern hin und her
      karte("#k5", 21.867, 28.667);
      const mx = [130, 410, 690];
      function springe(i, t, erst) {
        if (erst) tl.fromTo("#k5-maus", { opacity: 0, x: mx[i], y: 120 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
        else tl.to("#k5-maus", { x: mx[i], y: 120, duration: 0.28, ease: "power2.inOut" }, t);
        tl.to("#k5-aktiv", { attr: { x: 20 + i * 280 }, opacity: 1, duration: erst ? 0.01 : 0.28, ease: "power2.inOut" }, t);
      }
      springe(0, 22.333, true);
      springe(1, 22.867);
      springe(2, 23.433);
      springe(0, 23.90);
      springe(1, 24.233);
      auf("#k5-p1", 24.30, 0.2); auf("#k5-p2", 24.36, 0.2);
      tl.to("#k5-maus", { opacity: 0, duration: 0.2 }, 25.30);
      tl.to("#k5-aktiv", { attr: { x: 300 }, duration: 0.01 }, 25.50);
      tl.to("#k5-i1", { opacity: 0.18, duration: 0.2 }, 25.567);
      ein("#k5-erg", 25.567, 0.3);
      tl.fromTo("#k5-lupe", { opacity: 0, x: 330, y: 70 }, { opacity: 1, duration: 0.15 }, 26.067);
      tl.to("#k5-lupe", { x: 450, y: 130, duration: 0.6, ease: "power1.inOut" }, 26.10);
      badge("#k5-ok1", 26.433); badge("#k5-ok2", 26.60); badge("#k5-ok3", 26.77);
      tl.to("#k5-lupe", { opacity: 0, duration: 0.2 }, 27.0);
      tl.to("#k5-p1, #k5-p2", { opacity: 0.4, duration: 0.2 }, 27.30);
      pop("#k5-daten", 27.433, 0.25);
      tl.to("#k5-daten", { x: 560, duration: 0.3, ease: "power2.inOut" }, 27.733);
      tl.to("#k5-daten", { x: 0, duration: 0.3, ease: "power2.inOut" }, 28.05);
      tl.fromTo("#k5-kopie", { opacity: 0, x: 690, y: 207, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, 28.133);
      auf("#k5-daten2", 28.20, 0.12);
      schreibe("#k5-cliprect", 280, 27.80, 0.55);

      // K6 dieselbe Waage: Wechseln, Prüfen, Kopieren landen auf "Aufwand", auf "mehr Arbeit" kippt sie
      karte("#k6", 28.667, 30.767);
      stellWaage("k6", -13);
      tl.fromTo("#k6-g1", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.in" }, 28.70);
      tl.fromTo("#k6-g2", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.in" }, 28.867);
      tl.fromTo("#k6-g3", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.in" }, 29.033);
      kippe("k6", -4, 28.95, 0.35);
      kippe("k6", 15, 29.767, 0.5);
      tl.to("#k6-auf", { fill: "#0b0c0e", duration: 0.2 }, 29.767);
      schreibe("#k6-cliprect", 240, 29.967, 0.45);

      // K7 die KI ändert den Shop selbst, und du merkst es nicht
      karte("#k7", 30.767, 38.40);
      pop("#k7-ki", 32.567, 0.3);
      zeichne("#k7-weg", 32.867, 0.4);
      tl.fromTo("#k7-stift", { opacity: 0, x: 380, y: 82 }, { opacity: 1, duration: 0.15 }, 33.30);
      schreibe("#k7-n1", 190, 33.533, 0.45);
      tl.to("#k7-stift", { x: 360, y: 128, duration: 0.3, ease: "power2.inOut" }, 33.95);
      schreibe("#k7-n2", 170, 34.0, 0.4);
      tl.to("#k7-stift", { x: 276, y: 172, duration: 0.3, ease: "power2.inOut" }, 34.40);
      schreibe("#k7-n3", 86, 34.633, 0.3);
      auf("#k7-n4", 34.75, 0.3);
      tl.to("#k7-stift", { opacity: 0, duration: 0.2 }, 35.10);
      pop("#k7-du", 35.10, 0.3);
      badge("#k7-auge", 36.033);
      schreibe("#k7-cliprect", 270, 36.10, 0.5);
      // Sticker
      tl.fromTo("#st1", { opacity: 0, scale: 0.7, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power2.out" }, 31.10);
      tl.to("#st1", { opacity: 0, scale: 0.92, duration: 0.2, ease: "power2.in" }, 32.60);

      // K8 Berechtigungsmaske: Daten mit Schaltern, Aktionen mit Freigabe-Schloss
      karte("#k8", 38.40, 44.40);
      tl.set("#k8 .k8-d", { opacity: 0 }, 0);
      tl.set("#k8 .k8-a", { opacity: 0.3 }, 0);   // Aktionen stehen blass da (keine leere Spalte) und leuchten auf "Aktionen" auf
      tl.fromTo("#k8 .k8-d", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.12 }, 38.45);
      tl.to("#k8-s1", { fill: "#00d088", duration: 0.25 }, 40.10);
      tl.to("#k8-k1", { attr: { cx: 355 }, duration: 0.3, ease: "power2.inOut" }, 40.10);
      tl.to("#k8 .k8-d:nth-of-type(n+2)", { opacity: 0.55, duration: 0.3 }, 40.60);
      tl.to("#k8 .k8-a", { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.12 }, 41.533);
      badge("#k8-ok", 41.90);
      badge("#k8-schloss", 42.533);
      schreibe("#k8-cliprect", 210, 42.60, 0.45);
      zeichne("#k8-zeig", 42.95, 0.3);

      // K9 die falsche Frage: "Wie viele KI-Tools?" – Kacheln werden angesteckt, dann wird die Frage gestrichen
      karte("#k9", 44.40, 47.80);
      tl.set("#k9 .k9-k", { opacity: 0 }, 0);
      tl.fromTo("#k9 .k9-k", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out", stagger: 0.08 }, 45.0);
      zeichne("#k9-kabel", 45.967, 0.35);
      zeichne("#k9-strich", 46.467, 0.3);
      tl.to("#k9-frage", { fill: "#9aa3af", duration: 0.25 }, 46.467);
      schreibe("#k9-cliprect", 330, 46.50, 0.45);

      // K10 Zeit pro Prozess: Prozess 2 ist der Engpass
      karte("#k10", 47.80, 51.60);
      tl.to("#k10-b1", { attr: { width: 210 }, duration: 0.6, ease: "power2.out" }, 48.267);
      tl.to("#k10-b2", { attr: { width: 500 }, duration: 0.7, ease: "power2.out" }, 48.40);
      tl.to("#k10-b3", { attr: { width: 290 }, duration: 0.6, ease: "power2.out" }, 48.53);
      auf("#k10-b2v", 49.933, 0.25);
      tl.to("#k10-b1, #k10-b3", { opacity: 0.45, duration: 0.25 }, 49.933);
      badge("#k10-uhr", 49.933);
      schreibe("#k10-cliprect", 300, 50.367, 0.5);

      // K11 genau dieser Ablauf wird kürzer, eine KI dockt an, Haken – bleibt bis zum Ende stehen
      karte("#k11", 51.60);
      tl.set("#k11-uhr", { x: 730, y: 104 }, 0);
      ring("#k11-ring", 53.50);
      tl.set("#k11-platz", { opacity: 1 }, 53.833);
      tl.to("#k11-bar", { attr: { width: 200 }, duration: 0.6, ease: "power2.inOut" }, 53.833);
      tl.to("#k11-uhr", { x: 430, duration: 0.6, ease: "power2.inOut" }, 53.833);
      zeichne("#k11-weg", 55.10, 0.3);
      pop("#k11-ki", 55.30, 0.3);
      schreibe("#k11-cliprect", 230, 55.533, 0.5);
      badge("#k11-ok", 56.333);

      tl.seek(0);
      window.__timelines["kitools-skizzen"] = tl;
    </script>
  </body>
</html>
