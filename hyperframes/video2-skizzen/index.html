<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Video 2 – Karten</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Probe für Pauls Vorgabe 2026-10-22: helle Karte statt dunkler, saubere Icons (Lucide, ISC) statt Kreide-Skizzen,
         ruhige Bewegung nach den Motion-Regeln (kurz, kein Überschwingen, jede Bewegung zeigt eine Änderung).
         Das Hintergrundbild ist nur für die Probe da und bleibt privat (.gitignore). -->
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Geist", sans-serif; }
      .card {
        position: absolute; left: 110px; top: 300px; width: 860px; height: 300px;
        border-radius: 36px; background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.08);
        display: flex; align-items: center; gap: 44px; padding: 0 56px; opacity: 0;
      }
      .tile {
        flex: none; width: 176px; height: 176px; border-radius: 32px; background: linear-gradient(135deg, #00e090 0%, #31adec 100%);
        display: flex; align-items: center; justify-content: center;
      }
      .d { opacity: 0; }
      .tile svg { width: 104px; height: 104px; fill: none; stroke: #0b0c0e; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
      .txt { display: flex; flex-direction: column; gap: 10px; }
      .kicker { font-size: 30px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
      .head { font-size: 76px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: #0b0c0e; }
      .sub { font-size: 34px; font-weight: 500; color: #374151; }
      /* zweiter Teil des Titels im PulseConnect-Verlauf: Grün (#00E090) nach Hellblau (#31ADEC) */
      .verlauf { display: inline-block; padding-bottom: 6px; background: linear-gradient(90deg, #00d088 0%, #31adec 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .line { display: block; }
      .li { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: #0b0c0e; opacity: 0; display: block; }
      .li .verlauf { padding-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="47.5">
      <div id="k1" class="card clip" data-start="0.0" data-duration="6.20">
        <div class="tile"><svg viewBox="0 0 24 24"><path class="d" pathLength="1" d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path class="d" pathLength="1" d="M12 22V12" /><path class="d" pathLength="1" d="M3.3 7L12 12l8.7-5" /><path class="d" pathLength="1" d="M7.5 4.27l9 5.15" /></svg></div>
        <div class="txt">
          <span class="kicker line">2016</span>
          <span class="head line">Einstieg mit</span>
          <span class="head line"><span class="verlauf">Dropshipping</span></span>
        </div>
      </div>
      <div id="k2" class="card clip" data-start="7.0" data-duration="10.00">
        <div class="tile"><svg viewBox="0 0 24 24"><path class="d" pathLength="1" d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" /><path class="d" pathLength="1" d="M15 18H9" /><path class="d" pathLength="1" d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" /><circle class="d" pathLength="1" cx="17" cy="18" r="2" /><circle class="d" pathLength="1" cx="7" cy="18" r="2" /></svg></div>
        <div class="txt">
          <span class="kicker line">2020</span>
          <span class="head line">Corona:</span>
          <span class="head line"><span class="verlauf">Lieferengpässe</span></span>
        </div>
      </div>
      <div id="k3" class="card clip" data-start="18.0" data-duration="7.20">
        <div class="tile"><svg viewBox="0 0 24 24"><path class="d" pathLength="1" d="M9 12h.01" /><path class="d" pathLength="1" d="M15 12h.01" /><path class="d" pathLength="1" d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5" /><path class="d" pathLength="1" d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1" /></svg></div>
        <div class="txt">
          <span class="kicker line">2024</span>
          <span class="head line">Ich bin</span>
          <span class="head line"><span class="verlauf">Papa geworden</span></span>
        </div>
      </div>
      <div id="k4" class="card clip" data-start="26.0" data-duration="6.80">
        <div class="tile"><svg viewBox="0 0 24 24"><path class="d" pathLength="1" d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" /><circle class="d" pathLength="1" cx="7.5" cy="7.5" r=".5" /></svg></div>
        <div class="txt">
          <span class="kicker line">Anfang 2026</span>
          <span class="head line">Unternehmen</span>
          <span class="head line"><span class="verlauf">verkauft</span></span>
        </div>
      </div>
      <div id="k5" class="card clip" data-start="34.0" data-duration="13.0" style="height:430px">
        <div class="tile"><svg viewBox="0 0 24 24"><path class="d" pathLength="1" d="M16 7h6v6" /><path class="d" pathLength="1" d="m22 7-8.5 8.5-5-5L2 17" /></svg></div>
        <div class="txt">
          <span class="kicker line">Beim Verkauf zählt mehr als</span>
          <span class="head line"><span class="verlauf">Umsatz</span></span>
          <span class="li" id="l1">Profitabilität</span>
          <span class="li" id="l2">Prozesse</span>
          <span class="li" id="l3">Abhängigkeiten</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      function karte(id, an, aus) {
        const k = "#" + id;
        tl.fromTo(k, { opacity: 0, y: 28, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, an);
        tl.fromTo(k + " .tile", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "power3.out" }, an + 0.05);
        tl.fromTo(k + " .d", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut", stagger: 0.08 }, an + 0.12);
        tl.set(k + " .d", { opacity: 1 }, an + 0.2);
        tl.fromTo(k + " .line", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.07 }, an + 0.1);
        tl.fromTo(k + " .verlauf", { backgroundPosition: "-60px 0" }, { backgroundPosition: "0px 0", duration: 0.6, ease: "power2.out" }, an + 0.2);
        tl.to(k, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, aus - 0.25);
      }
      karte("k1", 0.0, 6.2);
      karte("k2", 7.0, 17.0);
      karte("k3", 18.0, 25.2);
      karte("k4", 26.0, 32.8);
      karte("k5", 34.0, 47.0);
      const li = (sel, at) => tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at);
      li("#l1", 38.3); li("#l2", 41.2); li("#l3", 44.1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
