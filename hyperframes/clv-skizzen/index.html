    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Karte rein mit Kicker (leer höchstens ~0,2 s), raus weich mit Blur und Fade
      function karte(id, an, aus) {
        tl.fromTo(id, { opacity: 0, y: 24, scale: 0.98, filter: "blur(0px)" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, an);
        const k = document.querySelector(id + " .kicker");
        if (k) tl.fromTo(k, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, an + 0.04);
        if (aus) tl.to(id, { opacity: 0, filter: "blur(8px)", y: -6, duration: 0.3, ease: "power2.in" }, aus - 0.3);
      }
      const ein = (sel, t, d = 0.3) => tl.fromTo(sel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
      const pop = (sel, t, d = 0.3) => tl.fromTo(sel, { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "power2.out" }, t);
      const badge = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, t);
      function zeichne(sel, t, d = 0.5, ease = "power2.out") {
        tl.set(sel, { opacity: 1 }, t);
        tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease }, t);
      }
      // Schreibschrift erscheint von links nach rechts (Clip-Rechteck wächst)
      function schreibe(sel, breite, t, d = 0.45) {
        tl.fromTo(sel, { attr: { width: 0 } }, { attr: { width: breite }, duration: d, ease: "power1.out" }, t);
      }
      gsap.set("#k2-l0, #k2-zukunft, #k3-klammer, #k4-band", { strokeDasharray: 1, strokeDashoffset: 1 });

      // K1 C-L-V: drei Buchstaben mit der Karte, "?" auf "CLV", auf jedes Wort Rahmen im Verlauf, Symbol und Wort
      karte("#k1", 4.12, 10.36);
      [["#k1-c", 4.16], ["#k1-l", 4.22], ["#k1-v", 4.28]].forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t));

      [["c", 8.78], ["l", 9.26], ["v", 9.62]].forEach(([b, t]) => {
        tl.to("#k1-" + b + "g", { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
        badge("#k1-" + b + "b", t);

      // K2 Zeitstrahl: Kunde, erste Bestellung heute mit 50 €, Zukunft zeichnet sich auf "Vielleicht", zwei Jahre,

      zeichne("#k2-l0", 10.96, 0.25);
      pop("#k2-b1", 10.96);
      ein("#k2-heute", 11.24);
      tl.fromTo("#k2-preis", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.12);
      zeichne("#k2-zukunft", 13.22, 2.2, "sine.inOut");
      tl.to("#k2-ende", { opacity: 1, duration: 0.2 }, 15.16);
      ein("#k2-2j", 15.42);
      pop("#k2-b2", 15.94);
      pop("#k2-b3", 18.38, 0.25); pop("#k2-b4", 18.66, 0.25); pop("#k2-b5", 18.80, 0.25); pop("#k2-b6", 18.96, 0.25);
      schreibe("#k2-cliprect", 260, 18.96, 0.5);

      // Sticker NIE.
      tl.fromTo("#st1", { opacity: 0, scale: 0.7, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power2.out" }, 21.95);
      tl.to("#st1", { opacity: 0, scale: 0.92, duration: 0.2, ease: "power2.in" }, 23.25);

      // K3 Blick: alle Bestellungen; auf "nur" Sucher um die erste, der Rest tritt zurück, "nur die erste?";

      tl.fromTo("#k3-sucher", { opacity: 0, scale: 1.15, svgOrigin: "120 150" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 22.45);

      schreibe("#k3-cliprect", 330, 22.75, 0.55);
      tl.to("#k3-hand", { opacity: 0, duration: 0.25, ease: "power2.in" }, 24.23);

      tl.to("#k3-rest", { opacity: 1, duration: 0.4, ease: "power2.out" }, 25.0);
      zeichne("#k3-klammer", 25.43, 0.5);
      ein("#k3-clv", 25.50, 0.3);

      // K4 Wert über die Kundenbeziehung: Kunde und Shop, Münzen stapeln sich auf "gesamten wirtschaftlichen", "Wert",

      tl.fromTo("#k4-kunde, #k4-shop", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 27.28);

      ein("#k4-wert", 30.21);
      tl.fromTo("#k4-ring", { opacity: 0, scale: 0.9, svgOrigin: "80 150" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 30.67);
      zeichne("#k4-band", 31.03, 0.7, "power1.inOut");
      ein("#k4-bez", 31.81);
      schreibe("#k4-cliprect", 200, 31.35, 0.45);

      // K5 Zwei Maßstäbe: Umsatz füllt sich, "oder?", Ergebnisbeitrag füllt sich nur zum Teil (der Rest gestrichelt),

      tl.to("#k5-l1", { fill: "#0b0c0e", duration: 0.25 }, 34.43);

      schreibe("#k5-cliprect", 170, 34.91, 0.4);
      tl.to("#k5-l2", { fill: "#0b0c0e", duration: 0.25 }, 36.05);
      tl.to("#k5-e", { attr: { width: 296 }, duration: 0.5, ease: "power2.out" }, 36.05);

      tl.fromTo("#k5-mass", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 36.95);

      // K6 Nachkauf: Produkt auf "Produkten", Kalender auf "regelmäßig", auf "nachgekauft" leert sich das Produkt, wird
      // nachgekauft (Kreislauf), jede Bestellung landet im Kalender und füllt die Wert-Säule; "Wert", "besonders wichtig"
      karte("#k6", 37.26, 42.42);
      tl.fromTo("#k6-produkt", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 37.31);
      [["#k6-s1", 38.82], ["#k6-s2", 38.88], ["#k6-s3", 38.94], ["#k6-s4", 39.00]].forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t));
      badge("#k6-kreis", 39.46);
      tl.fromTo("#k6-dreh", { rotation: 0 }, { rotation: 720, svgOrigin: "24 24", duration: 2.0, ease: "power1.inOut" }, 39.46);
      [39.46, 39.96, 40.46, 40.96].forEach((t, i) => {
        tl.to("#k6-fuell", { attr: { y: 226, height: 26 }, duration: 0.2, ease: "power2.in" }, t - 0.02);
        tl.to("#k6-fuell", { attr: { y: 120, height: 132 }, duration: 0.25, ease: "power2.out" }, t + 0.2);

      ein("#k6-wert", 41.30);
      schreibe("#k6-cliprect", 420, 41.58, 0.6);

      // K7 Folgen: Karte auf "Videos", Ring auf "verpassen", Zeiger tippt auf "Plus" das Plus an, es wird zum Haken
      tl.fromTo("#k7", { opacity: 0, y: 20, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 44.0);
      tl.fromTo("#fring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.7, ease: "power2.out" }, 46.06);
      tl.fromTo("#fzeiger", { opacity: 0, x: 330, y: 150 }, { opacity: 1, x: 310, y: 140, duration: 0.15, ease: "power2.out" }, 46.98);

      tl.to("#fzeiger", { scale: 0.85, duration: 0.08, ease: "power2.in" }, 47.50);

      tl.to("#fplus .haken", { opacity: 1, duration: 0.15 }, 47.58);
      tl.to("#ft2", { opacity: 1, duration: 0.2 }, 47.58);
      tl.to("#ft1", { opacity: 0, duration: 0.2 }, 47.58);
      tl.to("#fzeiger", { x: 132, y: 128, duration: 0.25, ease: "power2.out" }, 47.76);
      tl.to("#fzeiger", { opacity: 0, duration: 0.3, ease: "power2.in" }, 48.6);

      tl.seek(0);
      window.__timelines["clv-skizzen"] = tl;
    </script>
